name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Formatting and vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            gofmt -d .
            exit 1
          fi
      - name: Check module files
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./...

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go test -count=1 -timeout=2m ./...

  race-and-fuzz:
    name: Race, fuzz and Go reports
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      artifact_name: ${{ steps.source.outputs.artifact_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record tested source
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "artifact_name=go-quality-stable-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Remove stale report evidence
        id: report_cleanup
        run: |
          test ! -L .github
          rm -f -- .github/go-test-report.md .github/go-test-report.json .github/coverage.svg .github/goreportcard.svg .github/goreportcard-report.md
          rm -rf -- .github/test-results
      - name: Test, race and coverage
        id: go_test_report
        uses: soulteary/go-test-report-action@2760569379a1c95a195c602872ba00cd61495d89 # v1.1.3
        env:
          # Bootstrap with the action's Go version before it selects the project's go.mod.
          GOTOOLCHAIN: auto
        with:
          directory: .
          packages: ./...
          race: 'true'
          cover_mode: atomic
          timeout: 3m
          test_args: -count=1
          coverage_threshold: '0'
          # v1.1.2's release installer errors in its EXIT trap; use the same pinned source.
          version: source
          commit: 'false'
      - name: Display coverage from the same test run
        run: go tool cover -func=.github/test-results/coverage.out
      - name: Fuzz path validation
        run: go test -run='^$' -fuzz='^FuzzPathValidation$' -fuzztime=15s -parallel=2 -timeout=2m .
      - name: Go Report Card
        id: go_report_card
        if: ${{ !cancelled() && steps.report_cleanup.outcome == 'success' }}
        uses: soulteary/goreportcard-action@d4669a9fbea514f5995d749177630ebfee755789 # v1.1.4
        env:
          # The action installs its own Go version; allow checks to use go.mod's newer toolchain.
          GOTOOLCHAIN: auto
        with:
          directory: .
          version: v1.1.3
          threshold: '0'
          report: 'true'
          commit: 'false'
      - name: Verify complete Go Report Card evidence
        if: ${{ !cancelled() && steps.go_report_card.outcome == 'success' }}
        env:
          GOTOOLCHAIN: auto
        run: python3 .github/scripts/verify-go-report.py
      - name: Preserve stable reports
        if: ${{ always() && steps.report_cleanup.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          path: |
            .github/go-test-report.md
            .github/go-test-report.json
            .github/coverage.svg
            .github/goreportcard.svg
            .github/goreportcard-report.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Preserve raw test and checker evidence
        if: ${{ always() && steps.report_cleanup.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-quality-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  publish-reports:
    name: Publish verified Go reports
    needs: [quality, test, race-and-fuzz]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    concurrency:
      group: go-report-writeback-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out the tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.race-and-fuzz.outputs.source_sha }}
      - name: Download this run's stable reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          name: ${{ needs.race-and-fuzz.outputs.artifact_name }}
          path: ${{ runner.temp }}/go-quality-stable
      - name: Update reports only while the tested source is current
        env:
          SOURCE_SHA: ${{ needs.race-and-fuzz.outputs.source_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPORT_DIR: ${{ runner.temp }}/go-quality-stable
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH"
          current=$(git rev-parse FETCH_HEAD)
          if [ "$current" != "$SOURCE_SHA" ]; then
            echo "The default branch moved after testing; reports remain available as artifacts." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git switch -C "$DEFAULT_BRANCH" "$current"
          test ! -L .github
          reports=(go-test-report.md go-test-report.json coverage.svg goreportcard.svg goreportcard-report.md)
          for report in "${reports[@]}"; do
            test -s "$REPORT_DIR/$report"
            test ! -L "$REPORT_DIR/$report"
            test ! -L ".github/$report"
            cp -- "$REPORT_DIR/$report" ".github/$report"
            git add -- ".github/$report"
          done
          if git diff --cached --quiet; then
            echo "Published reports already match this run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Go quality reports" -m "Tested source: $SOURCE_SHA"
          # A concurrent source update rejects this ordinary push; never force-push reports.
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
